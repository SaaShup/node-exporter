name: Build and publish on GHCR

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip build+push, only (re-)notify the upgrade webhook"
        type: boolean
        default: false
      tag:
        description: "Tag to notify (only used with skip_publish; defaults to the selected ref)"
        required: false
        type: string

jobs:
  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.skip_publish
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.GHCR_IMAGE || format('ghcr.io/{0}', github.repository) }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  upgrade-webhook:
    name: Notify upgrade webhook
    needs: publish
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_publish))
    timeout-minutes: 5
    steps:
      - name: Check webhook configuration
        env:
          WEBHOOK_DOMAIN: ${{ vars.WEBHOOK_DOMAIN }}
          WEBHOOK_PATH: ${{ secrets.WEBHOOK_PATH }}
        run: |
          missing=""
          [ -n "$WEBHOOK_DOMAIN" ] || missing="$missing WEBHOOK_DOMAIN"
          [ -n "$WEBHOOK_PATH" ] || missing="$missing WEBHOOK_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s)/variable(s):$missing"
            exit 1
          fi

      - name: Notify upgrade webhook
        env:
          WEBHOOK_URL: https://${{ vars.WEBHOOK_DOMAIN }}${{ secrets.WEBHOOK_PATH }}
          IMAGE: ${{ vars.GHCR_IMAGE || format('ghcr.io/{0}', github.repository) }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":{\"repo_name\":\"$IMAGE\"},\"push_data\":{\"tag\":\"$TAG\"}}"
